# Local-only overlay: Vite bind-mount hot reload (gateway still hits helix-webui:80).
# Used by run-on-docker-local / redeploy-stack — NOT by run-on-docker-server.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -p helix up -d --force-recreate
name: helix
services:
  helix-webui:
    image: node:22-alpine
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://helix-api:8000
      VITE_API_BASE_URL: ""
      VITE_BASE_PATH: /helix/
      # Via nginx-gateway (helix.local / pc-armin:80) HMR websocket uses :80.
      # Direct host publish remains http://127.0.0.1:8181/helix/.
      VITE_HMR_CLIENT_PORT: "80"
      API_HOST: helix-api
      API_PORT: "8000"
    volumes:
      - .:/app
      - helix-webui-node-modules:/app/node_modules
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 80 --strictPort

volumes:
  helix-webui-node-modules:
    name: helix-webui-node-modules
    external: true
