# Local Docker hot-reload: SQLite Django + Vite WebUI (bind mounts).
# Usage: ..\scripts\install-local-docker.ps1
#   or: docker compose -f docker-compose.local.yml -p helix up -d --build
name: helix
services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    image: helix-api:local-dev
    container_name: cursor-helix-api-api
    restart: "no"
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: helix.settings
      HELIX_DEBUG: "true"
      HELIX_ALLOWED_HOSTS: "*"
      HELIX_DJANGO_ENGINE: sqlite
      HELIX_DJANGO_SQLITE_PATH: /app/backend/data/helix-django.sqlite3
      HELIX_CORS_ORIGINS: "http://127.0.0.1:5178,http://localhost:5178,http://helix.local,http://pc-armin"
      PORT: "8000"
      OPENROUTER_TOKEN: ${OPENROUTER_TOKEN:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
    entrypoint: []
    command:
      - sh
      - -c
      - pip install -q -r backend/requirements.txt && cd backend && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - helix-pip-cache:/root/.cache/pip
      - helix-sqlite-data:/app/backend/data
    ports:
      - "8173:8000"

  webui:
    image: node:22-alpine
    container_name: helix-webui
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://api:8000
      VITE_API_BASE_URL: ""
      VITE_BASE_PATH: /helix/
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../helix-webui:/app
      - helix-webui-node-modules:/app/node_modules
    ports:
      - "5178:5173"
    depends_on:
      - api

volumes:
  helix-sqlite-data:
    name: helix-sqlite-data
  helix-pip-cache:
    name: helix-pip-cache
  helix-webui-node-modules:
    name: helix-webui-node-modules
